<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://ovpcnnigwxqvqvhxtufe.supabase.co wss://ovpcnnigwxqvqvhxtufe.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Loba — Lingala &amp; Swahili</title>
<meta name="description" content="Apprends le lingala et le swahili du Congo, 5 minutes par jour. Learn Congolese Lingala and Swahili.">
<meta name="theme-color" content="#1E8FE1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#1E8FE1; --sky-d:#1670b3; --red:#D7263D; --red-d:#a81b2e; --sun:#FFC93C; --sun-d:#e0a812;
  --green:#3BB273; --green-d:#2a8a57; --purple:#7B5CD6; --purple-d:#5b40ad; --teal:#0FA3B1; --teal-d:#0b7c87; --fire:#ff8a00;
  --ink:#1d2433; --muted:#6b7385; --line:#e6e8ee; --bg:#fbf8f2; --card:#fff; --lock:#dfe2e8; --lock-d:#c4c8d1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
h1,h2,h3{font-family:'Baloo 2',sans-serif}
.screen{display:none}.screen.on{display:block}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:2px solid var(--line)}
.logo{font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--sky);display:flex;align-items:center;gap:6px}
.flag{width:30px;height:22px;border-radius:5px;background:var(--sky);position:relative;overflow:hidden;box-shadow:0 2px 0 var(--sky-d)}
.flag::before{content:"";position:absolute;left:-6px;top:8px;width:46px;height:7px;background:var(--red);transform:rotate(-32deg);border-top:2px solid var(--sun);border-bottom:2px solid var(--sun)}
.flag::after{content:"★";position:absolute;left:3px;top:-2px;color:var(--sun);font-size:10px}
.stats{display:flex;gap:14px;font-weight:900}
.stat{display:flex;align-items:center;gap:4px;font-size:16px}
.stat.fire{color:var(--fire)}.stat.gem{color:var(--sky)}.stat.heart{color:var(--red)}
.stat.dim{filter:grayscale(1);opacity:.6}
.langbtn{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:4px 9px;font-weight:900;font-size:13px;background:#fff;color:var(--ink);white-space:nowrap}
.top .stats{gap:10px}
.langlist{display:grid;gap:12px;margin:6px 0 16px;text-align:left}
.langlist .opt b{display:block}
.langlist .opt .pr{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px}
.langlist .opt.cur{border-color:var(--sky);background:#e8f4fd}
.stat.heart{cursor:pointer}
.card.promo{margin-top:12px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(135deg,#2b2140,#4a2f7a);color:#fff;border:none}
.promo .ic{font-size:30px}.promo b{display:block;font-weight:900}.promo small{opacity:.85;font-weight:700;font-size:13px}
.promo .go{background:var(--sun);color:var(--ink);border-radius:12px;padding:8px 10px;font-weight:900;font-size:12px;white-space:nowrap}
.pw{flex-direction:column;min-height:100vh;background:linear-gradient(180deg,#2b2140 0,#2b2140 260px,var(--bg) 260px)}
.pw.on{display:flex}
.pw-top{padding:18px;display:flex}.pw-top .close{color:rgba(255,255,255,.7)}
.pw-hero{text-align:center;color:#fff;padding:0 20px 26px}
.pw-hero .crown{font-size:64px;animation:bob 2s ease-in-out infinite}
.pw-hero h2{font-size:32px;line-height:1}.pw-hero h2 span{color:var(--sun)}
.pw-hero p{opacity:.85;font-weight:700;margin-top:6px}
.pw-body{padding:0 18px 30px;flex:1}
.perks{background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:16px}
.perks>div{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.perks>div:last-child{border:none}.perks span{font-size:22px;width:28px;text-align:center}
.perks small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.perks>div>div{flex:1}
.btn.gold{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.pw-note{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-top:12px}
.substat{display:flex;gap:12px;align-items:center}
.substat .ic{font-size:30px}.substat .tx{flex:1;font-weight:800}.substat small{display:block;color:var(--muted);font-weight:700}
.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;font:inherit;font-weight:800;font-size:18px;margin:4px 0 12px;background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--purple)}
.seg{display:flex;gap:8px;margin:4px 0 14px}.seg button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 6px;font-weight:900;font-size:14px;background:#fff}
.seg button.on{border-color:var(--purple);background:#f6f2ff;color:var(--purple-d)}
.sheet .err{color:var(--red-d);font-weight:800;font-size:14px;margin:-4px 0 10px;min-height:18px}
.sheet .lbl2{text-align:left;font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--purple);margin:6px auto 14px;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.badge-lang{display:inline-block;background:#fff1e0;color:#b85f00;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:900;margin-left:6px;vertical-align:middle}

/* learn */
.pad{padding:0 18px 110px}
.unit-head{margin:22px 0 10px;padding:14px 16px;border-radius:18px;color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.unit-head .k{font-size:12px;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.unit-head .t{font-family:'Baloo 2';font-size:21px;line-height:1.1}
.unit-head .tipbtn{background:rgba(255,255,255,.22);border-radius:12px;padding:8px 10px;font-size:18px}
.unit-tip{display:none;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:6px}
.unit-tip.on{display:block}.unit-tip b{color:var(--ink)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 8px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;transition:transform .1s;position:relative}
.node:active{transform:translateY(4px)}
.node.locked{background:var(--lock)!important;box-shadow:0 7px 0 var(--lock-d)!important;color:#a3a9b6;font-size:24px}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--line)}
.startbub{position:absolute;top:-46px;background:#fff;border:2px solid var(--line);color:var(--sky);font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;letter-spacing:.5px;z-index:2}
.startbub::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes bob{50%{transform:translateY(-6px)}}
.node.chest{border-radius:18px;width:72px;height:66px;font-size:34px}
.node.chest.ready{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.qcard{margin-top:16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.qcard .ic{font-size:30px}
.qcard .tx{flex:1;font-weight:800}
.qcard .tx small{display:block;color:var(--muted);font-weight:700}
.minibar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;position:relative}
.minibar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.msg{margin-top:12px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;position:relative;overflow:hidden}
.msg .k{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;opacity:.9}
.msg .li{font-family:'Baloo 2';font-size:23px;font-weight:800;line-height:1.15;margin:4px 0 2px}
.msg .fr{font-size:14px;opacity:.92;font-weight:700}
.msg .row{display:flex;gap:8px;margin-top:12px}
.msg .row a,.msg .row button{flex:1;text-align:center;background:#fff;color:#128C7E;border-radius:12px;padding:10px;font-weight:900;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.msg .row button{background:rgba(255,255,255,.2);color:#fff}
.msg .done{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.25);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:900}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mini{text-align:left;border-bottom-width:5px;position:relative}
.mini .ic{font-size:28px}
.mini b{display:block;font-weight:900;margin-top:4px;line-height:1.15}
.mini small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.mini .tag{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:900;padding:2px 8px}
.mini.off{opacity:.6}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:2px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
.nav button span{font-size:24px;filter:grayscale(.6);opacity:.7;position:relative}
.nav button.on{color:var(--sky)}
.nav button.on span{filter:none;opacity:1}
.nav .dot span::after{content:"";position:absolute;top:-2px;right:-6px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* hero + lists */
.hero{margin:18px 0 6px;padding:18px;border-radius:20px;color:#fff;position:relative;overflow:hidden}
.hero h2{font-size:26px;line-height:1.1}
.hero p{font-size:14px;opacity:.92;margin-top:4px;max-width:78%}
.hero .big{position:absolute;right:14px;top:10px;font-size:56px}
.sec{font-family:'Baloo 2';font-size:20px;font-weight:800;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:'Nunito';font-size:13px;color:var(--fire);font-weight:900}
.sit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:12px;border-bottom-width:5px;position:relative}
.sit .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none}
.sit .bd{flex:1}
.sit b{display:block;font-weight:900;font-size:16px}
.sit small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.sit .stars{font-size:13px;margin-top:3px;letter-spacing:1px}
.sit .reco{position:absolute;top:-10px;left:14px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:900;border-radius:99px;padding:2px 10px}
.quest{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.quest .ic{font-size:28px;width:40px;text-align:center}
.quest .bd{flex:1}.quest .t{font-weight:800}
.quest .minibar{height:14px}
.quest .minibar b{position:absolute;inset:0;font-size:10px;display:grid;place-items:center;color:var(--ink);font-weight:900}
.claim{padding:9px 12px;border-radius:12px;font-weight:900;font-size:13px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);white-space:nowrap}
.claim:disabled{background:var(--lock);box-shadow:0 4px 0 var(--lock-d);color:#8c93a1}
.claim.done{background:none;box-shadow:none;color:var(--green-d)}
.flashcard{background:linear-gradient(135deg,var(--fire),#ff5a3c);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.flashcard h3{font-size:24px}
.flashcard p{font-size:14px;opacity:.95;margin:4px 0 14px;max-width:72%}
.flashcard .best{position:absolute;right:16px;top:14px;text-align:center;font-weight:900;background:rgba(255,255,255,.2);border-radius:14px;padding:8px 12px}
.flashcard .best b{display:block;font-family:'Baloo 2';font-size:26px;line-height:1}

.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.btn:disabled{background:var(--lock);color:#a3a9b6;box-shadow:0 5px 0 var(--lock-d);cursor:default}
.btn.blue{background:var(--sky);box-shadow:0 5px 0 var(--sky-d)}
.btn.white{background:#fff;color:var(--fire);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:transparent;color:var(--sky);box-shadow:none;margin-top:8px}

/* profile */
.prof{display:flex;align-items:center;gap:14px;margin:20px 0 6px}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:40px;box-shadow:0 5px 0 var(--sun-d);flex:none}
.prof h2{font-size:26px;line-height:1}
.prof small{color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--card)}
.sbox .ic{font-size:24px}
.sbox b{font-family:'Baloo 2';font-size:22px;display:block;line-height:1}
.sbox small{color:var(--muted);font-weight:700;font-size:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;background:var(--card)}
.badge .ic{font-size:34px;display:block}
.badge b{font-size:13px;display:block;margin-top:4px}
.badge small{font-size:11px;color:var(--muted);font-weight:700;display:block;line-height:1.2;margin-top:2px}
.badge.off .ic{filter:grayscale(1);opacity:.35}.badge.off b{color:var(--muted)}
.word{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.word .l{flex:1}.word .l b{display:block}.word .l small{color:var(--muted);font-weight:700}
.str{display:flex;gap:3px}.str i{width:8px;height:18px;border-radius:3px;background:var(--line)}.str i.on{background:var(--green)}
.str.weak i.on{background:var(--fire)}

/* lesson */
.lesson,.flash,.onb,.dlg,.mach{flex-direction:column;min-height:100vh}
.lesson.on,.flash.on,.onb.on,.dlg.on,.mach.on{display:flex}
.l-top{display:flex;align-items:center;gap:12px;padding:18px 18px 10px}
.close{font-size:26px;color:#a3a9b6;line-height:1}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;background:var(--green);border-radius:99px;transition:width .35s;position:relative}
.prog .fill::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.l-hearts{font-weight:900;color:var(--red);font-size:16px;display:flex;align-items:center;gap:3px}
.l-hearts.hit{animation:shake .4s}
.combo{height:24px;padding:0 18px;font-weight:900;color:var(--fire);font-size:14px;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.l-body{flex:1;padding:4px 18px 20px;display:flex;flex-direction:column}
.q-kind{font-family:'Baloo 2';font-size:22px;font-weight:800;margin-bottom:14px}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mascot{width:64px;height:64px;flex:none;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:34px;box-shadow:0 4px 0 var(--sun-d)}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:21px;font-weight:800;background:var(--card)}
.bubble.lg{font-family:'Baloo 2';color:var(--sky-d)}
.opts{display:grid;gap:12px}
.opt,.tile{border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;background:var(--card);text-align:left;transition:all .08s}
.opt:active,.tile:active{transform:translateY(2px);border-bottom-width:3px}
.opt small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
.opt.sel{border-color:var(--sky);background:#e8f4fd;color:var(--sky-d)}
.opt.good{border-color:var(--green);background:#e7f7ee;color:var(--green-d)}
.opt.bad{border-color:var(--red);background:#fde9ec;color:var(--red-d);animation:shake .3s}
.opt:disabled{cursor:default}
.opt.big{display:flex;align-items:center;gap:14px}
.opt.big .e{font-size:30px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px}
.tile{text-align:center;font-size:16px;padding:14px 8px}
.tile.sel{border-color:var(--sky);background:#e8f4fd;color:var(--sky-d)}
.tile.done{opacity:.35;pointer-events:none;border-color:var(--green);color:var(--green-d)}
.tile.wrong{border-color:var(--red);background:#fde9ec;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank .tile,.answer-line .tile{padding:10px 14px;font-size:17px}
.tile.ghost{visibility:hidden}
.foot{border-top:2px solid var(--line);padding:16px 18px 22px;background:var(--bg);transition:background .2s}
.foot.good{background:#d7f5e3;border-color:transparent}
.foot.bad{background:#fde0e4;border-color:transparent}
.fb{display:none;margin-bottom:12px}
.foot.good .fb,.foot.bad .fb{display:block}
.fb h3{font-size:22px}
.foot.good .fb h3{color:var(--green-d)}.foot.bad .fb h3{color:var(--red-d)}
.fb p{font-weight:700;margin-top:2px}
.foot.bad .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}

/* flash */
.f-top{display:flex;align-items:center;gap:12px;padding:18px}
.timer{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--fire);border-radius:99px;transition:width .1s linear}
.timer.low i{background:var(--red)}
.fscore{font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--fire);min-width:44px;text-align:right}
.f-body{padding:10px 18px}
.plus{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:'Baloo 2';font-weight:800;font-size:40px;pointer-events:none;opacity:0;z-index:50}
.plus.go{animation:rise .6s ease}
@keyframes rise{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-140%)}}

/* onboarding */
.onb-body{flex:1;padding:24px 20px 30px;display:flex;flex-direction:column}
.onb .hello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.onb .hello .mascot{width:120px;height:120px;font-size:70px;box-shadow:0 8px 0 var(--sun-d);animation:bob 2s ease-in-out infinite}
.onb .hello h1{font-size:34px;line-height:1.05}
.onb .hello p{color:var(--muted);font-weight:700;font-size:17px;max-width:320px}
.onb .ask{display:flex;gap:12px;align-items:center;margin:10px 0 22px}
.onb .ask .bubble{font-size:18px}
.onb .list{display:grid;gap:12px}
.onb .spacer{flex:1}
.res{display:grid;gap:10px;margin:14px 0 24px}
.res div{display:flex;gap:12px;align-items:center;font-weight:800}
.res div span{font-size:26px;width:36px;text-align:center}

/* dialogue */
.d-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.d-top .av{width:44px;height:44px;border-radius:50%;background:#f1ecff;display:grid;place-items:center;font-size:26px}
.d-top .who{flex:1;font-weight:900;line-height:1.1}
.d-top .who small{display:block;color:var(--green-d);font-weight:700;font-size:12px}
.hint{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:900;font-size:13px;color:var(--muted)}
.hint.on{border-color:var(--sky);color:var(--sky);background:#e8f4fd}
.chat{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;background:#efe7dc;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px;overflow-y:auto}
.dtip{background:#fff7d9;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:#7a5b00;align-self:center;text-align:center;max-width:92%}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:16px;animation:pop .25s ease;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.bub b{display:block;font-weight:800}
.bub small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px;transition:filter .2s}
.bub small.hid{filter:blur(5px);cursor:pointer}
.bub.npc{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:#d9fdd3;align-self:flex-end;border-top-right-radius:4px}
.bub.typing{color:var(--muted);font-weight:900;letter-spacing:3px}
.choices{padding:14px 16px 22px;display:grid;gap:10px;border-top:2px solid var(--line);background:var(--bg);min-height:120px}
.choices .opt{font-size:16px;padding:12px 14px}

/* machine */
.m-body{flex:1;padding:6px 18px 30px}
.out{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin:8px 0 6px}
.out .li{font-family:'Baloo 2';font-size:30px;font-weight:800;line-height:1.1}
.out .fr{color:var(--muted);font-weight:800;margin-top:6px}
.out .leg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;font-size:12px;font-weight:800}
.out .leg span{border-radius:99px;padding:3px 9px}
.mp{color:var(--sky)}.ma{color:var(--green-d)}.mt{color:var(--purple)}.mv{color:var(--fire)}.mn{color:var(--red)}
.lp{background:#e8f4fd;color:var(--sky-d)}.la{background:#e7f7ee;color:var(--green-d)}.lt{background:#f1ecff;color:var(--purple-d)}.lv{background:#fff1e0;color:#b85f00}.ln{background:#fde9ec;color:var(--red-d)}
.lab{font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;background:#fff}
.pill small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.pill.on{border-color:var(--sky);background:#e8f4fd;color:var(--sky-d)}
.pill.on small{color:var(--sky-d)}
.target{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border-radius:16px;padding:14px 16px;font-weight:800;display:flex;gap:12px;align-items:center}
.target .t{flex:1}.target small{display:block;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.target b{font-family:'Baloo 2';font-size:19px;display:block;line-height:1.15}
.target .w{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px;font-weight:900;white-space:nowrap}
.target.win{animation:pop .4s ease;background:linear-gradient(135deg,var(--green),var(--green-d))}

/* end */
.end{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 22px;text-align:center}
.end.on{display:flex}
.end .big{font-size:84px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.end h2{font-size:32px;color:var(--sun-d);margin:8px 0 4px}
.end .sub{color:var(--muted);font-weight:700;margin-bottom:22px}
.chips{display:flex;gap:10px;margin-bottom:18px;width:100%}
.chip{flex:1;border:2px solid;border-radius:16px;overflow:hidden;font-weight:800}
.chip .h{color:#fff;font-size:11px;padding:5px 2px;text-transform:uppercase;letter-spacing:.5px}
.chip .v{padding:12px 4px;font-size:21px;font-family:'Baloo 2'}
.chip.a{border-color:var(--sun)}.chip.a .h{background:var(--sun);color:var(--ink)}
.chip.b{border-color:var(--green)}.chip.b .h{background:var(--green)}
.chip.c{border-color:var(--fire)}.chip.c .h{background:var(--fire)}
.extra{width:100%;text-align:left;margin-bottom:14px}
.extra .kit{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 14px}
.extra .kit div{padding:8px 0;border-bottom:1px solid var(--line);font-weight:800}
.extra .kit div:last-child{border:none}
.extra .kit small{display:block;color:var(--muted);font-weight:700}
.newq{width:100%;margin-bottom:14px;display:grid;gap:8px}
.newq div{background:#f1ecff;color:var(--purple-d);border-radius:12px;padding:10px;font-weight:800;font-size:14px}
.share{width:100%;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px;font-weight:700;margin-bottom:16px;text-align:left;white-space:pre-line;font-size:15px}
.end .btns{width:100%}

/* modal/toast */
.ov{position:fixed;inset:0;background:rgba(20,24,35,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:26px 22px 28px;text-align:center;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.sheet .big{font-size:64px}
.sheet h2{font-size:26px;margin:6px 0}
.sheet p{color:var(--muted);font-weight:700;margin-bottom:18px}
.sheet .btn+.btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(200px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:800;transition:transform .3s;z-index:40;max-width:90%;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

.nav button b{font-weight:800}
</style>

// Nettoie un état venant du stockage ou du cloud : types attendus, valeurs bornées.
function sanitize(o){
 const S0=fresh();if(!o||typeof o!=='object')return S0;
 const num=(v,d,min=0,max=1e9)=>Number.isFinite(+v)?Math.min(max,Math.max(min,+v)):d;
 const out={...S0};
 for(const k of ['xp','gems','streak','bestStreak','total','perfect','flashBest','sitDone','sentTotal','reviews'])out[k]=num(o[k],S0[k]);
 out.savedAt=num(o.savedAt,0,0,1e15);out.hearts=num(o.hearts,MAXH,0,MAXH);out.heartTs=o.heartTs?num(o.heartTs,null,0,1e15):null;out.goal=[20,40,60].includes(+o.goal)?+o.goal:40;
 out.ui=o.ui==='en'?'en':o.ui==='fr'?'fr':S0.ui;out.lang=o.lang in LANGS?o.lang:'ln';out.motive=o.motive in MOTIVES?o.motive:'famille';
 out.onboarded=!!o.onboarded;out.hints=o.hints!==false;out.donated=!!o.donated;out.lastDay=typeof o.lastDay==='string'?o.lastDay:null;
 const q=o.q||{};out.q={day:typeof q.day==='string'?q.day:today(),xp:num(q.xp,0),lessons:num(q.lessons,0),comboMax:num(q.comboMax,0),flashBest:num(q.flashBest,0),sent:num(q.sent,0,0,1),claimed:Array.isArray(q.claimed)?q.claimed.filter(x=>QUESTS.some(Q=>Q.id===x)):[]};
 out.per={};
 for(const c in LANGS){const p=(o.per||{})[c]||{},L=LANGS[c],f=freshLang();
  f.started=!!p.started;f.level=p.level in LEVELS?p.level:'zero';
  L.units.forEach(u=>{if(p.prog&&p.prog[u.id])f.prog[u.id]=num(p.prog[u.id],0,0,LPU);if(p.chests&&p.chests[u.id])f.chests[u.id]=true});
  for(const k in (p.words||{}))if(L.wm[k])f.words[k]={lvl:num(p.words[k].lvl,0,0,5),ko:num(p.words[k].ko,0,0,999)};
  L.sits.forEach(s=>{if(p.sit&&p.sit[s.id])f.sit[s.id]=num(p.sit[s.id],0,0,3)});
  out.per[c]=f}
 return out;
}

/* ======================= MACHINE À PHRASES ======================= */
const FR_SUBJ=['je','tu','il/elle','nous','vous','ils/elles'],EN_SUBJ=['I','you','he/she','we','you (all)','they'];
const ETRE=['suis','es','est','sommes','êtes','sont'],ALLER=['vais','vas','va','allons','allez','vont'],BE=['am','are','is','are','are','are'];
const EN_VERB={manger:['eat','eating'],boire:['drink','drinking'],aller:['go','going'],venir:['come','coming'],dormir:['sleep','sleeping'],travailler:['work','working'],parler:['speak','speaking'],apprendre:['learn','learning']};
const EN_PRON=['I','You','He / She','We','You (all)','They'];
function meaning(o,vb){
 const comp=o.c>=0?vb.c[o.c]:null;
 if(S.ui==='en'){const [inf,ing]=EN_VERB[vb.fr],be=BE[o.p],neg=o.n?' not':'';
  let s=`${EN_SUBJ[o.p]} ${be}${neg} `+(o.t==='prog'?ing:`going to ${inf}`);if(comp)s+=' '+tr(comp[1]);return cap(s)}
 const aux=(o.t==='prog'?ETRE:ALLER)[o.p],vow=/^[aeéêiou]/.test(aux);
 let fr=FR_SUBJ[o.p]+' '+(o.n?(vow?"n'":'ne ')+aux+' pas':aux);
 fr+=o.t==='prog'?(/^[aeiou]/.test(vb.fr)?" en train d'":' en train de ')+vb.fr:' '+vb.fr;
 if(comp)fr+=' '+comp[1];return cap(fr);
}
const subjOf=p=>(S.ui==='en'?EN_SUBJ:FR_SUBJ)[p];
const verbOf=vb=>S.ui==='en'?'to '+EN_VERB[vb.fr][0]:vb.fr;
function buildLn(o){
 const m=LANGS.ln.mach,px=m.pron[o.p][0],vb=m.verbs[o.v],root=vb.v.slice(2),comp=o.c>=0?vb.c[o.c]:null;let h,s;
 if(o.t==='prog'){s=`${px}zali ${vb.v}`;h=`<span class="mp">${cap(px)}</span><span class="ma">zali</span> <span class="mv">${vb.v}</span>`}
 else{s=`${px}ko${root}`;h=`<span class="mp">${cap(px)}</span><span class="mt">ko</span><span class="mv">${root}</span>`}
 if(comp){s+=' '+comp[0];h+=' '+esc(comp[0])}
 if(o.n){s+=' te';h+=' <span class="mn">te</span>'}
 const leg=[['lp',`${px} = ${subjOf(o.p)}`],o.t==='prog'?['la',S.ui==='en'?'zali = to be (‑ing)':'zali = être (en train de)']:['lt',S.ui==='en'?'ko = going to (future)':'ko = futur proche'],['lv',`${o.t==='prog'?vb.v:root} = ${verbOf(vb)}`]];
 if(o.n)leg.push(['ln',S.ui==='en'?'te = negation':'te = négation']);
 return {liH:h,liT:cap(s),leg};
}
function buildSw(o){
 const m=LANGS.sw.mach,vb=m.verbs[o.v],comp=o.c>=0?vb.c[o.c]:null;let px,mk,stem;
 if(!o.n){px=m.pron[o.p][0];mk=o.t==='prog'?'na':'ta';stem=vb.st}
 else if(o.t==='fut'){px=m.neg[o.p];mk='ta';stem=vb.st}
 else{px=m.neg[o.p];mk='';stem=vb.ng;if(px==='ham'&&/^[aeiou]/.test(stem))px='hamw'}
 let s=px+mk+stem,h=`<span class="${o.n?'mn':'mp'}">${cap(px)}</span>${mk?`<span class="${mk==='na'?'ma':'mt'}">${mk}</span>`:''}<span class="mv">${stem}</span>`;
 if(comp){s+=' '+comp[0];h+=' '+esc(comp[0])}
 const en=S.ui==='en',leg=[o.n?['ln',`${px} = ${subjOf(o.p)} (${en?'negative':'négatif'})`]:['lp',`${px} = ${subjOf(o.p)}`]];
 leg.push(mk==='na'?['la',en?'na = present':'na = présent']:mk==='ta'?['lt',en?'ta = future':'ta = futur']:['ln',en?'-a → -i = present negative':'-a → -i = négation au présent']);
 leg.push(['lv',`${stem} = ${verbOf(vb)}`]);
 return {liH:h,liT:cap(s),leg};
}
const BUILD={ln:buildLn,sw:buildSw};

 b.innerHTML=`<div class="target ${M.won?'win':''}"><div class="t"><small>${M.won?t('bravo5'):t('buildIn',{lang:lname()})}</small><b>« ${esc(tg)} »</b></div><div class="w">🏅 ${M.wins}</div></div>

  <div class="lab">${t('complement')}</div><div class="pills" id="mC"></div><div class="lab">${t('when')}</div><div class="pills" id="mT"></div>
  <div style="display:flex;gap:10px;margin-top:22px" id="mBtns"></div>`;
 const pills=(id,items,cur,fn)=>items.forEach(([v,l,s])=>{const x=document.createElement('button');x.className='pill'+(cur===v?' on':'');x.innerHTML=esc(l)+(s?`<small>${esc(s)}</small>`:'');x.onclick=()=>{sfx('pop');fn(v);renderMach()};$(id).appendChild(x)});

 pills('mC',[[-1,'—',t('none')],...mc.verbs[M.v].c.map((c,i)=>[i,c[0],tr(c[1])])],M.c,v=>M.c=v);
 const tens=mc.tenses.map(([k,l,s])=>[k,en?(k==='prog'?(S.lang==='sw'?'Present':'Right now'):(S.lang==='sw'?'Future':'Near future')):l,s]);
 pills('mT',[...tens,['neg',(M.n?'✓ ':'')+t('negative'),mc.negHint]],M.t,v=>{if(v==='neg')M.n=!M.n;else M.t=v});
 if(M.n)[...$('mT').children][2].classList.add('on');
 const c1=btn('btn blue',t('copy'),()=>copy(`${out.liT}\n(${now})`)),c2=btn('btn',t('otherChallenge'),()=>{newTarget();renderMach()});
 c1.style.flex=c2.style.flex='1';c2.style.cssText+=';background:var(--purple);box-shadow:0 5px 0 var(--purple-d)';$('mBtns').append(c1,c2);

 $('pWords').innerHTML=ws.length?ws.slice(0,20).map(([k,v])=>`<div class="word"><div class="l"><b>${esc(k)}</b><small>${esc(tr(LG.wm[k][1]))}</small></div><div class="str ${v.ko&&v.lvl<4?'weak':''}">${[0,1,2,3,4].map(i=>`<i class="${i<v.lvl?'on':''}"></i>`).join('')}</div></div>`).join(''):`<div style="color:var(--muted);font-weight:700;padding:8px 0">${t('noWords')}</div>`;
}
$('resetBtn').onclick=()=>sheet(`<div class="big">⚠️</div><h2>${t('resetTitle')}</h2><p>${t('resetText')}</p>`,[{label:t('resetYes'),cls:'red',fn:()=>{const ui=S.ui;S=fresh();S.ui=ui;LG=LANGS.ln;save();startOnb()}},{label:t('cancel'),cls:'ghost'}]);
function accountSheet(){
 if(!sb)return;
 $('sheet').innerHTML=`<div class="big">☁️</div><h2>${t('accTitle')}</h2><p>${t('accText')}</p><input class="field" id="accMail" type="email" autocomplete="email" maxlength="120" placeholder="email@exemple.com"><div class="err" id="accErr"></div>`;
 const msg=(m,ok)=>{$('accErr').style.color=ok?'var(--green-d)':'';$('accErr').textContent=m};
 const mail=()=>{const v=$('accMail').value.trim();return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?v:null};
 $('sheet').append(
  btn('btn gold',t('accSave'),async()=>{const e=mail();if(!e)return msg(t('badEmail'));try{await cloud.session();const {error}=await sb.auth.updateUser({email:e});if(error)throw error;msg(t('accCheck'),true)}catch(er){msg(er.message||'Erreur')}}),
  btn('btn ghost',t('accRestore'),async()=>{const e=mail();if(!e)return msg(t('accEmailFirst'));try{const {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});if(error)throw error;msg(t('accLink'),true)}catch(er){msg(er.message||'Erreur')}}),
  btn('btn ghost',t('close'),closeSheet));
 $('ov').classList.add('on');
}

/* ======================= LEÇON / RÉVISION ======================= */
let L=null;
function buildExercises(u){
 const ex=[],ws=shuffle(u.words);
 ws.slice(0,3).forEach(w=>ex.push({type:'mc',dir:'lf',item:w,pool:u.words}));
 ws.slice(3,5).forEach(w=>ex.push({type:'mc',dir:'fl',item:w,pool:u.words}));
 pick(u.sentences,2).forEach(s=>ex.push({type:'build',s}));
 while(ex.length<7){const w=ws[ex.length%ws.length];ex.push({type:'mc',dir:Math.random()<.5?'lf':'fl',item:w,pool:u.words})}
 const r=shuffle(ex);r.splice(3,0,{type:'match',pairs:pick(u.words,4)});return r;
}
function startLesson(i){regen();if(S.hearts<=0)return noHearts(()=>startLesson(i));
 L={u:LG.units[i],queue:buildExercises(LG.units[i]),idx:0,total:8,correct:0,answered:0,errors:0,combo:0,comboMax:0,state:'answer',sel:null,retried:new Set()};show('lesson');renderEx()}
function startReview(){
 const weak=weakWords().slice(0,6),pool=openWords();
 const q=shuffle(weak.map(w=>({type:'mc',dir:Math.random()<.5?'lf':'fl',item:w,pool:pool.length>=4?pool:LG.units[0].words})));
 if(weak.length>=4)q.splice(2,0,{type:'match',pairs:weak.slice(0,4)});
 L={review:true,u:{id:'review'},queue:q,idx:0,total:q.length,correct:0,answered:0,errors:0,combo:0,comboMax:0,state:'answer',sel:null,retried:new Set()};
 show('lesson');renderEx();toast(t('reviewToast'));
}
function noHearts(retry,onQuit){
 sheet(`<div class="big">💔</div><h2>${t('noHeartsTitle')}</h2><p>${t('noHeartsText')}</p>`,[
  {label:t('refill',{n:REFILL}),cls:'blue',disabled:S.gems<REFILL,fn:()=>{S.gems-=REFILL;S.hearts=MAXH;S.heartTs=null;save();sfx('coin');retry&&retry()}},
  {label:t('reviewHeart'),disabled:weakWords().length<3,fn:()=>{onQuit&&onQuit();startReview()}},
  {label:t('later'),cls:'ghost',fn:()=>{onQuit&&onQuit();show(tab)}}]);
}
function setProgress(){$('progFill').style.width=Math.min(100,L.correct/L.total*100)+'%';$('lHeartN').textContent=S.hearts;$('lHearts').style.visibility=L.review?'hidden':''}
function renderEx(){
 setProgress();$('foot').className='foot';$('checkBtn').textContent=t('check');$('checkBtn').disabled=true;L.state='answer';L.sel=null;
 const e=L.queue[L.idx],b=$('body');b.innerHTML='';
 if(e.type==='mc'){
  const [li,fr]=e.item,q=e.dir==='lf'?li:tr(fr),ans=e.dir==='lf'?tr(fr):li;
  const others=pick(e.pool.filter(w=>w[0]!==li&&w[1]!==fr),3).map(w=>e.dir==='lf'?tr(w[1]):w[0]);
  b.innerHTML=`<div class="q-kind">${L.review?'🧠 ':''}${e.dir==='lf'?t('whatMeans'):t('howSay',{lang:lname()})}</div><div class="prompt"><div class="mascot">🦜</div><div class="bubble ${e.dir==='lf'?'lg':''}">${esc(q)}</div></div><div class="opts" id="opts"></div>`;
  shuffle([ans,...others]).forEach(o=>{const x=btn('opt',o,()=>{if(L.state!=='answer')return;document.querySelectorAll('#opts .opt').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');L.sel=o;$('checkBtn').disabled=false});$('opts').appendChild(x)});
  e.answer=ans;
 }else if(e.type==='match'){
  b.innerHTML=`<div class="q-kind">${t('pairs')}</div><div class="match"><div class="col" id="cl"></div><div class="col" id="cr"></div></div>`;
  let left=null,right=null,found=0;e.perfect=true;
  const tryPair=()=>{if(!left||!right)return;
   if(left.dataset.k===right.dataset.k){left.classList.add('done');right.classList.add('done');found++;track(left.dataset.k,true);sfx('good');if(found===e.pairs.length)checkAnswer()}
   else{e.perfect=false;track(left.dataset.k,false);sfx('bad');const a=left,c=right;[a,c].forEach(z=>z.classList.add('wrong'));setTimeout(()=>[a,c].forEach(z=>z.classList.remove('wrong')),400)}
   left.classList.remove('sel');right.classList.remove('sel');left=right=null};
  shuffle(e.pairs).forEach(p=>{const x=btn('tile',p[0],()=>{if(left)left.classList.remove('sel');left=x;x.classList.add('sel');tryPair()});x.dataset.k=p[0];$('cl').appendChild(x)});
  shuffle(e.pairs).forEach(p=>{const x=btn('tile',tr(p[1]),()=>{if(right)right.classList.remove('sel');right=x;x.classList.add('sel');tryPair()});x.dataset.k=p[0];$('cr').appendChild(x)});
 }else{
  const [fr,li,distract]=e.s;
  b.innerHTML=`<div class="q-kind">${t('translateSentence')}</div><div class="prompt"><div class="mascot">🦜</div><div class="bubble">${esc(tr(fr))}</div></div><div class="answer-line" id="line"></div><div class="bank" id="bank"></div>`;
  const chosen=[];const upd=()=>{$('checkBtn').disabled=!chosen.length;L.sel=chosen.map(c=>c.w).join(' ')};
  shuffle([...li.replace(/[?!]/g,'').split(' '),...distract]).forEach(w=>{const tile=btn('tile',w,()=>{if(L.state!=='answer')return;
    const rec={w};const c=btn('tile',w,()=>{if(L.state!=='answer')return;chosen.splice(chosen.indexOf(rec),1);c.remove();tile.classList.remove('ghost');upd()});
    chosen.push(rec);$('line').appendChild(c);tile.classList.add('ghost');upd()});
   $('bank').appendChild(tile)});
  e.answer=li;
 }
}
function checkAnswer(){
 const e=L.queue[L.idx];const ok=e.type==='match'?e.perfect:norm(L.sel||'')===norm(e.answer);
 if(e.type==='mc'){track(e.item[0],ok);document.querySelectorAll('#opts .opt').forEach(o=>{o.disabled=true;if(o.textContent===e.answer)o.classList.add('good');else if(o.classList.contains('sel'))o.classList.add('bad')})}
 L.answered++;const f=$('foot');
 if(ok){L.correct++;L.combo++;L.comboMax=Math.max(L.comboMax,L.combo);sfx('good');f.className='foot good';$('fbTitle').textContent=pick(LG.praise,1)[0];$('fbText').textContent=e.type==='match'?t('allPairs'):''}
 else{
  L.errors++;L.combo=0;if(!L.review){loseHeart();$('lHearts').classList.remove('hit');void $('lHearts').offsetWidth;$('lHearts').classList.add('hit')}
  sfx('bad');f.className='foot bad';$('fbTitle').textContent=t('notQuite')+(L.review?'':t('minusHeart'));
  $('fbText').textContent=e.type==='match'?t('pairsRetry'):t('goodAnswer',{a:e.answer})+(e.type==='mc'?t('willReview'):'');
  if(!L.retried.has(e)){L.retried.add(e);L.queue.push(e)}
 }
 const cb=$('combo');if(L.combo>=3){cb.textContent=t('inARow',{n:L.combo});cb.classList.add('on')}else cb.classList.remove('on');
 save();setProgress();L.state='next';$('checkBtn').textContent=t('continue');$('checkBtn').disabled=false;
}
$('checkBtn').onclick=()=>{
 if(L.state==='answer')return checkAnswer();
 if(!L.review&&S.hearts<=0&&L.correct<L.total)return noHearts(()=>{L.idx++;nextEx()},()=>{L=null});
 L.idx++;nextEx();
};
function nextEx(){if(L.idx>=L.queue.length||L.correct>=L.total)finishLesson();else renderEx()}
$('quit').onclick=()=>sheet(`<div class="big">🥺</div><h2>${t('leaveTitle')}</h2><p>${t('leaveText')}</p>`,[{label:t('keepGoing'),cls:'blue'},{label:t('quit'),cls:'ghost',fn:()=>{$('combo').classList.remove('on');show(tab)}}]);

/* ======================= DÉFI ÉCLAIR ======================= */
let F=null;
function startFlash(){F={score:0,end:Date.now()+60000,timer:null,lock:false,pool:openWords()};show('flash');$('fScore').textContent='0';
 F.timer=setInterval(()=>{const r=F.end-Date.now();$('timerFill').style.width=Math.max(0,r/600)+'%';$('timer').classList.toggle('low',r<10000);if(r<=0)endFlash()},100);flashNext()}
function flashNext(){
 F.lock=false;const w=pick(F.pool,1)[0],dir=Math.random()<.5?'lf':'fl',q=dir==='lf'?w[0]:tr(w[1]),ans=dir==='lf'?tr(w[1]):w[0];
 const others=pick(F.pool.filter(x=>x!==w),3).map(x=>dir==='lf'?tr(x[1]):x[0]);
 $('fBody').innerHTML=`<div class="prompt"><div class="mascot" style="background:var(--fire);box-shadow:0 4px 0 #c96a00">⚡</div><div class="bubble ${dir==='lf'?'lg':''}">${esc(q)}</div></div><div class="opts" id="fOpts"></div>`;
 shuffle([ans,...others]).forEach(o=>{const x=btn('opt',o,()=>{if(F.lock)return;F.lock=true;const ok=o===ans;track(w[0],ok);
   x.classList.add(ok?'good':'bad');if(!ok)document.querySelectorAll('#fOpts .opt').forEach(y=>{if(y.textContent===ans)y.classList.add('good')});
   const p=$('plus');p.textContent=ok?'+1':'−3s';p.style.color=ok?'var(--green)':'var(--red)';p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
   if(ok){F.score++;sfx('good')}else{F.end-=3000;sfx('bad')}$('fScore').textContent=F.score;setTimeout(()=>F&&F.timer&&flashNext(),ok?280:700)});
  $('fOpts').appendChild(x)});
}
function endFlash(){
 clearInterval(F.timer);F.timer=null;const sc=F.score,rec=sc>S.flashBest;
 S.flashBest=Math.max(S.flashBest,sc);S.q.flashBest=Math.max(S.q.flashBest,sc);addXp(sc);if(sc>0)bumpStreak();save();sfx('win');
 showEnd({icon:rec?'🏅':'⏱️',title:t(rec?'newRecord':'timeUp'),sub:sc>=15?t('flashStrong',{s:LG.strong,n:LG.native}):t('flashRetry'),labA:t('score'),a:sc,labB:t('record'),b:S.flashBest,
  share:t('shareFlash',{n:sc,lang:lname()}),back:'sQuests'});
}
$('fQuit').onclick=()=>{clearInterval(F.timer);F=null;show(tab)};

/* ======================= FIN D'ACTIVITÉ ======================= */
let BACK='sLearn';
function finishLesson(){
 const acc=Math.round(L.correct/Math.max(L.answered,1)*100),perfect=L.errors===0;$('combo').classList.remove('on');
 S.q.comboMax=Math.max(S.q.comboMax,L.comboMax);
 if(L.review){
  const gain=S.hearts<MAXH;S.hearts=Math.min(MAXH,S.hearts+1);if(S.hearts>=MAXH)S.heartTs=null;S.reviews++;addXp(8);bumpStreak();save();sfx('win');
  showEnd({icon:'🧠',title:t('reviewDone'),sub:t(gain?'reviewGain':'reviewMax'),labA:t('xpWon'),a:'+8',labB:t('precision'),b:acc+'%',share:t('shareReview',{lang:lname(),p:acc}),back:'sLearn'});return}
 const xp=10+L.correct+(perfect?5:0)+(L.comboMax>=5?3:0);
 addXp(xp);S.q.lessons++;S.total++;if(perfect)S.perfect++;LP().prog[L.u.id]=Math.min(LPU,(LP().prog[L.u.id]||0)+1);bumpStreak();save();sfx('win');
 showEnd({icon:perfect?'🌟':'🎉',title:t(perfect?'lessonPerfect':'lessonDone'),sub:perfect?t('perfectSub',{s:LG.strong}):t('doneSub',{g:LG.good}),labA:t('xpWon'),a:'+'+xp,labB:t('precision'),b:acc+'%',
  share:t('shareLesson',{d:S.streak,lang:lname(),u:tr(L.u.title),p:acc,hi:LG.hi}),back:'sLearn'});
}
function showEnd(o){
 $('eIcon').textContent=o.icon;$('eTitle').textContent=o.title;$('eSub').textContent=o.sub;$('eLabA').textContent=o.labA;$('eA').textContent=o.a;$('eLabB').textContent=o.labB;$('eB').textContent=o.b;$('eC').textContent='🔥 '+S.streak;
 $('eExtra').innerHTML=o.extra||'';
 const q=$('eQuests');q.innerHTML='';
 QUESTS.filter(x=>x.val()>=x.goal()&&!S.q.claimed.includes(x.id)).forEach(x=>{const d=document.createElement('div');d.textContent=t('questDone',{q:x.t(),r:x.r});q.appendChild(d)});
 if(donationsOn()&&S.total>0&&S.total%5===0&&!S.donated){const d=document.createElement('div');d.style.cssText='background:#fde9ec;color:var(--red-d);cursor:pointer';d.textContent=t('donAsk');d.onclick=openDonate;q.appendChild(d)}
 $('shareTxt').textContent=o.share;BACK=o.back||'sLearn';show('end');
}
$('copyBtn').onclick=()=>copy($('shareTxt').textContent);
$('homeBtn').onclick=()=>show(questsReady()?'sQuests':BACK);

/* ======================= DÉMARRAGE ======================= */
applyStatic();dayCheck();regen();
if(S.onboarded&&LP().started)show('sLearn');else startOnb(S.onboarded);
cloud.pull();
setInterval(()=>{if(MAIN.includes(tab)&&$(tab).classList.contains('on'))render()},60000);
// Application installable + hors ligne (seulement sur le vrai site, pas en aperçu)
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>
